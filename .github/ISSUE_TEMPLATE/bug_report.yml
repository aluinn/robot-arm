name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the structure or challenge you picked, and attach an exported recording (JSON) if you have one.
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: Chrome 130 on macOS 15
    validations:
      required: true
  - type: dropdown
    id: device
    attributes:
      label: Device
      options: [Desktop, Phone or tablet]
    validations:
      required: true
  - type: textarea
    id: console
    attributes:
      label: Console output
      description: Any errors from the browser developer console.
      render: text
